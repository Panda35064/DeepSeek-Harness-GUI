name: Build and release DeepSeek Harness GUI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Install dependencies
        run: npm ci

      - name: Include MinGW runtime DLLs
        shell: pwsh
        run: |
          $gcc = (Get-Command gcc.exe).Source
          $runtimeDir = Split-Path $gcc
          $targetDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release'
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          @('libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll') | ForEach-Object {
            Copy-Item (Join-Path $runtimeDir $_) $targetDir -Force
          }

      - name: Build Tauri application
        run: npm exec -- tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-GUI-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Prepare bilingual release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $notes = @'
          ## DeepSeek Harness GUI

          ### 更新内容 / What's New

          - 自动安装前可选择 Node.js 下载源（官方源 / 镜像源），安装时显示实时下载进度百分比。
            Choose the Node.js download source (official / mirror) before automatic installation, with a live download progress percentage.
          - 官方源、阿里云镜像源、腾讯镜像源三级回退，任一源不可用自动切换，安装过程显示实时进度。
            Three-level fallback across the official source, Aliyun mirror and Tencent mirror, with live progress shown during installation.
          - 未检测到 Node.js 时自动下载便携版运行环境，无需手动安装。
            Automatically downloads a portable Node.js runtime when it is missing; no manual installation required.
          - 已安装时再次运行安装程序，可选择“重新安装（升级到新版本）”或“卸载此软件”。
            When the app is already installed, the installer offers "Reinstall (upgrade to new version)" or "Uninstall this software".
          - 卸载时勾选“删除应用程序数据”会快速清理 Node.js 运行时、npm 包、配置和日志，无残留。
            Checking "Delete the application data" during uninstall quickly removes the Node.js runtime, npm packages, config and logs with no leftovers.

          ### 修复 / Fixes

          - 修复自动安装卡在“正在准备自动安装...”无法继续的问题。
            Fixed automatic installation getting stuck at "Preparing automatic installation...".
          - 修复失败原因被隐藏、界面停留在加载状态的问题。
            Fixed hidden failure reasons that left the UI stuck on the loading screen.
          - 修复 Node.js 便携版解压复制与临时文件清理误报失败的问题。
            Fixed Node.js portable runtime copy and temporary file cleanup reporting false failures.
          - 修复 dsh 插件加载失败问题（运行环境升级到 Node.js 24 LTS）。
            Fixed dsh plugin loading failures by upgrading the runtime to Node.js 24 LTS.

          ### 安装 / Installation

          下载并运行 `*-setup.exe`，安装器会自动处理依赖（Node.js、npm 等），无需提前安装。
          Download and run `*-setup.exe`. The installer handles dependencies (Node.js, npm, etc.) automatically.
          '@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          body_path: release-notes.md
          generate_release_notes: false

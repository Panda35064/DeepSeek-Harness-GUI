<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:3080" />
    <title>DeepSeek Harness</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        color: #334155;
        background:
          radial-gradient(1100px 560px at 88% -12%, rgba(96, 165, 250, 0.18), transparent 62%),
          radial-gradient(900px 520px at -8% 112%, rgba(129, 140, 248, 0.16), transparent 62%),
          #f6f8fc;
      }
      .card {
        width: 400px;
        padding: 44px 38px 38px;
        text-align: center;
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 22px;
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        box-shadow: 0 16px 48px rgba(30, 41, 59, 0.10);
      }
      .logo { width: 84px; height: 84px; margin: 0 auto 20px; }
      .logo svg { width: 100%; height: 100%; display: block; }
      h1 { font-size: 19px; font-weight: 600; color: #0f172a; margin-bottom: 6px; }
      .sub { font-size: 13px; color: #64748b; margin-bottom: 26px; }
      .ring {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        border: 4px solid rgba(77, 107, 254, 0.16);
        border-top-color: #4D6BFE;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .step {
        font-size: 12.5px;
        color: #94a3b8;
        min-height: 18px;
      }
      .hint {
        margin-top: 8px;
        font-size: 11.5px;
        line-height: 1.5;
        color: #a3adbd;
        min-height: 17px;
      }
      .hint.failure {
        color: #dc2626;
      }
      .install-card { margin-top: 6px; }
      .install-card h2 { font-size: 16px; color: #0f172a; margin-bottom: 8px; font-weight: 600; }
      .install-card p { font-size: 13px; color: #64748b; line-height: 1.7; margin-bottom: 22px; }
      .btns { display: flex; gap: 12px; justify-content: center; }
      button {
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 13.5px;
        cursor: pointer;
        font-family: inherit;
        transition: filter 0.15s, background 0.15s;
      }
      button.primary {
        background: #4D6BFE;
        color: #fff;
        border: 1px solid #4D6BFE;
      }
      button.primary:hover { filter: brightness(1.08); }
      button.ghost {
        background: transparent;
        color: #4D6BFE;
        border: 1px solid rgba(77, 107, 254, 0.45);
      }
      button.ghost:hover { background: rgba(77, 107, 254, 0.08); }
      button:disabled { opacity: 0.55; cursor: default; }
      .error { color: #dc2626; font-size: 12.5px; margin-top: 16px; min-height: 16px; }
      .hidden { display: none; }

      @media (prefers-color-scheme: dark) {
        body {
          color: #cbd5e1;
          background:
            radial-gradient(1100px 560px at 88% -12%, rgba(77, 107, 254, 0.20), transparent 62%),
            radial-gradient(900px 520px at -8% 112%, rgba(129, 140, 248, 0.16), transparent 62%),
            #0f172a;
        }
        .card {
          background: rgba(30, 41, 59, 0.60);
          border: 1px solid rgba(148, 163, 184, 0.18);
          box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
        }
        h1 { color: #f1f5f9; }
        .sub { color: #94a3b8; }
        .step { color: #64748b; }
        .install-card h2 { color: #f1f5f9; }
        .install-card p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><title>DeepSeek</title><path d="M23.748 4.482c-.254-.124-.364.113-.512.234-.051.039-.094.09-.137.136-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.156-.708-.311-.955-.65-.172-.241-.219-.51-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.093.172.187.129.323-.082.28-.18.552-.266.833-.055.179-.137.217-.329.14a5.526 5.526 0 01-1.736-1.18c-.857-.828-1.631-1.742-2.597-2.458a11.365 11.365 0 00-.689-.471c-.985-.957.13-1.743.388-1.836.27-.098.093-.432-.779-.428-.872.004-1.67.295-2.687.684a3.055 3.055 0 01-.465.137 9.597 9.597 0 00-2.883-.102c-1.885.21-3.39 1.102-4.497 2.623C.082 8.606-.231 10.684.152 12.85c.403 2.284 1.569 4.175 3.36 5.653 1.858 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.133-.284 4.994-1.86.47.234.962.327 1.78.397.63.059 1.236-.03 1.705-.128.735-.156.684-.837.419-.961-2.155-1.004-1.682-.595-2.113-.926 1.096-1.296 2.746-2.642 3.392-7.003.05-.347.007-.565 0-.845-.004-.17.035-.237.23-.256a4.173 4.173 0 001.545-.475c1.396-.763 1.96-2.015 2.093-3.517.02-.23-.004-.467-.247-.588zM11.581 18c-2.089-1.642-3.102-2.183-3.52-2.16-.392.024-.321.471-.235.763.09.288.207.486.371.739.114.167.192.416-.113.603-.673.416-1.842-.14-1.897-.167-1.361-.802-2.5-1.86-3.301-3.307-.774-1.393-1.224-2.887-1.298-4.482-.02-.386.093-.522.477-.592a4.696 4.696 0 011.529-.039c2.132.312 3.946 1.265 5.468 2.774.868.86 1.525 1.887 2.202 2.891.72 1.066 1.494 2.082 2.48 2.914.348.292.625.514.891.677-.802.09-2.14.11-3.054-.614zm1-6.44a.306.306 0 01.415-.287.302.302 0 01.2.288.306.306 0 01-.31.307.303.303 0 01-.304-.308zm3.11 1.596c-.2.081-.399.151-.59.16a1.245 1.245 0 01-.798-.254c-.274-.23-.47-.358-.552-.758a1.73 1.73 0 01.016-.588c.07-.327-.008-.537-.239-.727-.187-.156-.426-.199-.688-.199a.559.559 0 01-.254-.078c-.11-.054-.2-.19-.114-.358.028-.054.16-.186.192-.21.356-.202.767-.136 1.146.016.352.144.618.408 1.001.782.391.451.462.576.685.914.176.265.336.537.445.848.067.195-.019.354-.25.452z" fill="#4D6BFE"></path></svg>
      </div>
      <h1 id="title">DeepSeek Harness</h1>
      <p class="sub" id="subText">正在启动本地服务</p>
      <div id="loadingWrap">
        <div class="ring"></div>
        <p class="step" id="stepText">正在检测运行环境...</p>
        <p class="hint hidden" id="hintText"></p>
        <p class="error hidden" id="errorText"></p>
      </div>
      <div class="install-card hidden" id="installCard">
        <h2>未检测到 DeepSeek Harness</h2>
        <p>未在默认安装路径或环境变量中找到 dsh。<br />请选择安装方式继续：</p>
        <div class="btns">
          <button id="btnAuto" class="primary">自动安装</button>
          <button id="btnManual" class="ghost">手动选择路径</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var step = document.getElementById('stepText');
        var wrap = document.getElementById('loadingWrap');
        var title = document.getElementById('title');
        var sub = document.getElementById('subText');
        var card = document.getElementById('installCard');
        var err = document.getElementById('errorText');
        var hint = document.getElementById('hintText');
        var btnAuto = document.getElementById('btnAuto');
        var btnManual = document.getElementById('btnManual');

        var isChinese = /^zh(?:-|$)/i.test(navigator.language || '');
        var lang = isChinese ? 'zh' : 'en';
        var copy = {
          zh: {
            sub: '正在启动本地服务',
            checking: '正在检测运行环境...',
            notFound: '未检测到 DeepSeek Harness',
            choose: '未在默认安装路径或环境变量中找到 dsh。<br />请选择安装方式继续：',
            auto: '自动安装',
            manual: '手动选择路径',
            installHint: '首次安装可能需要几分钟，请勿关闭窗口',
            preparing: '正在准备自动安装...',
            done: '安装完成，正在启动服务...',
            failed: '操作失败，请重试'
          },
          en: {
            sub: 'Starting local service',
            checking: 'Checking the environment...',
            notFound: 'DeepSeek Harness not found',
            choose: 'dsh was not found in the default path or environment variables.<br />Choose an installation method to continue:',
            auto: 'Install automatically',
            manual: 'Choose a path',
            installHint: 'The first installation may take a few minutes. Please keep this window open.',
            preparing: 'Preparing automatic installation...',
            done: 'Installation complete. Starting the service...',
            failed: 'Operation failed. Please try again.'
          }
        }[lang];

        document.documentElement.lang = isChinese ? 'zh-CN' : 'en';
        sub.textContent = copy.sub;
        step.textContent = copy.checking;
        document.querySelector('#installCard h2').textContent = copy.notFound;
        document.querySelector('#installCard > p').innerHTML = copy.choose;
        btnAuto.textContent = copy.auto;
        btnManual.textContent = copy.manual;

        function localizeProgress(message) {
          if (lang === 'zh' || !message) return message;
          var translations = [
            ['正在检测运行环境', 'Checking the environment'],
            ['未检测到安装', 'No installation found'],
            ['已找到 DeepSeek Harness，正在启动服务', 'DeepSeek Harness found. Starting the service'],
            ['正在下载并安装 DeepSeek Harness（npm 官方包）', 'Downloading and installing DeepSeek Harness (official npm package)'],
            ['npm 安装未成功，切换到源码安装', 'npm installation failed. Switching to source installation'],
            ['npm 配置读取异常，切换到源码安装', 'Could not read npm configuration. Switching to source installation'],
            ['npm 安装完成但未找到入口，切换到源码安装', 'npm installation completed but no entry point was found. Switching to source installation'],
            ['正在克隆 DeepSeek Harness 源码', 'Cloning DeepSeek Harness source'],
            ['正在安装依赖（pnpm install）', 'Installing dependencies (pnpm install)'],
            ['正在构建（pnpm build）', 'Building (pnpm build)'],
            ['源码安装完成', 'Source installation complete'],
            ['安装完成，正在启动服务', copy.done],
            ['服务已就绪', 'Service is ready'],
            ['服务启动超时，请查看日志确认状态', 'Service startup timed out. Check the logs for details'],
            ['检测到服务已在运行', 'Service is already running'],
            ['正在启动本地服务', 'Starting local service']
          ];
          for (var i = 0; i < translations.length; i++) {
            if (message.indexOf(translations[i][0]) === 0) return translations[i][1] + message.slice(translations[i][0].length);
          }
          return message;
        }

        function localizeError(message) {
          if (lang === 'zh' || !message) return message || copy.failed;
          var translations = [
            ['未找到 Node.js', 'Node.js was not found'],
            ['未找到 npm 组件，无法自动安装', 'The npm component was not found, so automatic installation is unavailable'],
            ['未找到 Git，无法从源码安装', 'Git was not found, so source installation is unavailable'],
            ['未找到 pnpm，无法从源码安装', 'pnpm was not found, so source installation is unavailable'],
            ['npm 安装执行失败', 'npm installation failed'],
            ['pnpm install 失败', 'pnpm install failed'],
            ['pnpm build 失败', 'pnpm build failed']
          ];
          for (var i = 0; i < translations.length; i++) {
            if (message.indexOf(translations[i][0]) === 0) return translations[i][1] + message.slice(translations[i][0].length);
          }
          return message;
        }

        function showError(msg) {
          var message = localizeError(msg);
          step.textContent = copy.failed;
          hint.textContent = message;
          hint.classList.remove('hidden');
          hint.classList.add('failure');
          err.classList.add('hidden');
          wrap.classList.remove('hidden');
          card.classList.add('hidden');
          btnAuto.disabled = false;
          btnManual.disabled = false;
        }

        function showInstall() {
          title.classList.add('hidden');
          sub.classList.add('hidden');
          wrap.classList.add('hidden');
          card.classList.remove('hidden');
        }

        var tauri = window.__TAURI__;
        if (tauri && tauri.event) {
          tauri.event.listen('dsh-progress', function (e) {
            var p = e.payload || {};
            if (p.message) step.textContent = localizeProgress(p.message);
          }).catch(function () {});
          tauri.event.listen('dsh-need-install', function () {
            showInstall();
          }).catch(function () {});
          tauri.event.listen('dsh-error', function (e) {
            showError((e.payload || {}).message);
          }).catch(function () {});

          btnAuto.addEventListener('click', function () {
            btnAuto.disabled = true;
            btnManual.disabled = true;
            err.textContent = '';
            card.classList.add('hidden');
            title.classList.remove('hidden');
            sub.classList.remove('hidden');
            wrap.classList.remove('hidden');
            step.textContent = copy.preparing;
            hint.textContent = copy.installHint;
            hint.classList.remove('failure');
            hint.classList.remove('hidden');
            err.classList.add('hidden');
            tauri.core.invoke('dsh_install_auto').catch(showError);
          });
          btnManual.addEventListener('click', function () {
            btnAuto.disabled = true;
            btnManual.disabled = true;
            err.textContent = '';
            tauri.core.invoke('dsh_pick_manual').catch(showError);
          });
        } else {
          showInstall();
        }

        (function waitForServer() {
          fetch('http://127.0.0.1:3080', { mode: 'no-cors' })
            .then(function () { location.replace('http://127.0.0.1:3080'); })
            .catch(function () { setTimeout(waitForServer, 300); });
        })();
      })();
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="928" height="928" viewBox="0 0 928 928">
  <defs>
    <!-- 玻璃卡片主体：上白 → 下白灰渐变 -->
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FBFBFD" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#F0F0F4" stop-opacity="0.96"/>
    </linearGradient>

    <!-- 玻璃顶部高光（左上斜向） -->
    <linearGradient id="glassHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 玻璃边缘光（内描边） -->
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#C7D2FF" stop-opacity="0.55"/>
    </linearGradient>

    <!-- 卡片底部内阴影（厚度感，替代外投影） -->
    <linearGradient id="cardInnerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8D8E2" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9C9D6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 鲸鱼主体渐变：高光点蓝紫色（左上）→ 主题色（右下） -->
    <linearGradient id="whaleBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5B4FF"/>
      <stop offset="0.4" stop-color="#6E86FE"/>
      <stop offset="0.65" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#3E5AF0"/>
    </linearGradient>

    <!-- 鲸鱼顶部镜面高光（玻璃反光带） -->
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 鲸鱼底部内阴影（玻璃厚度/深度） -->
    <linearGradient id="innerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3BC8" stop-opacity="0"/>
      <stop offset="1" stop-color="#1E3BC8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 鲸鱼边缘高光描边：只在受光区（顶部/左上）点亮，颜色与边缘渐变融合后渐隐 -->
    <linearGradient id="edgeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#C3CFFF" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#7E99FF" stop-opacity="0.25"/>
      <stop offset="0.65" stop-color="#6B86FB" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4D6BFE" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur24" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blur8" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- 鲸鱼路径（24x24 坐标系，供各层复用） -->
    <path id="whalePath" d="M23.748 4.482c-.254-.124-.364.113-.512.234-.051.039-.094.09-.137.136-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.156-.708-.311-.955-.65-.172-.241-.219-.51-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.093.172.187.129.323-.082.28-.18.552-.266.833-.055.179-.137.217-.329.14a5.526 5.526 0 01-1.736-1.18c-.857-.828-1.631-1.742-2.597-2.458a11.365 11.365 0 00-.689-.471c-.985-.957.13-1.743.388-1.836.27-.098.093-.432-.779-.428-.872.004-1.67.295-2.687.684a3.055 3.055 0 01-.465.137 9.597 9.597 0 00-2.883-.102c-1.885.21-3.39 1.102-4.497 2.623C.082 8.606-.231 10.684.152 12.85c.403 2.284 1.569 4.175 3.36 5.653 1.858 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.133-.284 4.994-1.86.47.234.962.327 1.78.397.63.059 1.236-.03 1.705-.128.735-.156.684-.837.419-.961-2.155-1.004-1.682-.595-2.113-.926 1.096-1.296 2.746-2.642 3.392-7.003.05-.347.007-.565 0-.845-.004-.17.035-.237.23-.256a4.173 4.173 0 001.545-.475c1.396-.763 1.96-2.015 2.093-3.517.02-.23-.004-.467-.247-.588zM11.581 18c-2.089-1.642-3.102-2.183-3.52-2.16-.392.024-.321.471-.235.763.09.288.207.486.371.739.114.167.192.416-.113.603-.673.416-1.842-.14-1.897-.167-1.361-.802-2.5-1.86-3.301-3.307-.774-1.393-1.224-2.887-1.298-4.482-.02-.386.093-.522.477-.592a4.696 4.696 0 011.529-.039c2.132.312 3.946 1.265 5.468 2.774.868.86 1.525 1.887 2.202 2.891.72 1.066 1.494 2.082 2.48 2.914.348.292.625.514.891.677-.802.09-2.14.11-3.054-.614zm1-6.44a.306.306 0 01.415-.287.302.302 0 01.2.288.306.306 0 01-.31.307.303.303 0 01-.304-.308zm3.11 1.596c-.2.081-.399.151-.59.16a1.245 1.245 0 01-.798-.254c-.274-.23-.47-.358-.552-.758a1.73 1.73 0 01.016-.588c.07-.327-.008-.537-.239-.727-.187-.156-.426-.199-.688-.199a.559.559 0 01-.254-.078c-.11-.054-.2-.19-.114-.358.028-.054.16-.186.192-.21.356-.202.767-.136 1.146.016.352.144.618.408 1.001.782.391.451.462.576.685.914.176.265.336.537.445.848.067.195-.019.354-.25.452z"/>

    <clipPath id="whaleClip">
      <use href="#whalePath"/>
    </clipPath>
  </defs>

  <!-- 白底玻璃卡片（占满画布，圆角矩形） -->
  <rect x="0" y="0" width="928" height="928" rx="216" fill="url(#glassBody)"/>

  <!-- 玻璃卡片内部层次 -->
  <clipPath id="cardClip">
    <rect x="0" y="0" width="928" height="928" rx="216"/>
  </clipPath>
  <g clip-path="url(#cardClip)">
    <!-- 底部内阴影（厚度感，替代外投影） -->
    <rect x="0" y="520" width="928" height="408" fill="url(#cardInnerShadow)"/>
    <!-- 顶部高光 -->
    <rect x="0" y="0" width="928" height="480" fill="url(#glassHighlight)"/>
    <ellipse cx="252" cy="182" rx="430" ry="240" fill="#FFFFFF" opacity="0.22" filter="url(#blur24)"/>
    <rect x="0" y="0" width="928" height="6" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- 玻璃内描边 -->
  <rect x="1" y="1" width="926" height="926" rx="215" fill="none" stroke="url(#glassEdge)" stroke-width="3"/>

  <!-- 鲸鱼底层投影（轻微悬浮感，在卡片内） -->
  <use href="#whalePath" transform="translate(82,124) scale(32)" fill="#2A4AE0" opacity="0.3" filter="url(#blur24)"/>

  <!-- 鲸鱼主体层（渐变 + 玻璃质感立体层次） -->
  <g transform="translate(82,86) scale(32)">
    <use href="#whalePath" fill="url(#whaleBody)"/>
    <g clip-path="url(#whaleClip)">
      <rect x="-2" y="-2" width="28" height="9.5" fill="url(#topGlow)"/>
      <ellipse cx="5.5" cy="5" rx="4.6" ry="3.2" fill="#FFFFFF" opacity="0.5" filter="url(#blur8)"/>
      <ellipse cx="14" cy="6.5" rx="5" ry="2.4" fill="#FFFFFF" opacity="0.22" filter="url(#blur8)"/>
      <rect x="-2" y="13.5" width="28" height="12" fill="url(#innerShadow)"/>
    </g>
    <use href="#whalePath" fill="none" stroke="url(#edgeLight)" stroke-width="0.45"/>
  </g>
</svg>

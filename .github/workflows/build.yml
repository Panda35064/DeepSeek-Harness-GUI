name: Build and release DeepSeek Harness GUI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri application
        run: npm exec -- tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-GUI-windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
